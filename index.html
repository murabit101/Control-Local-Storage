<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Local Storage</title>
  <link rel="icon" type="image/png" href="imgs/website-icon.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="container">
    <input type="text" placeholder="Local Storage Item">
    <div class="buttons">
      <span class="check-btn">Check Item</span>
      <span class="add-btn">Add Item</span>
      <span class="delete-btn">Delete Item</span>
      <span class="show-btn">Show Items</span>
    </div>
    <div class="results">
      <span>No Results To Show</span>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
